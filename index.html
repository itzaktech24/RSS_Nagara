<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nagara — Bangalore Dakshin</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --saffron: #E8580A;
    --gold: #C9901A;
    --cream: #FAF6EE;
    --dark: #1A1208;
    --muted: #7A6A50;
    --border: #DDD0B8;
    --panel: #FFF9F0;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--dark); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { background: var(--dark); padding: 10px 24px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; border-bottom: 2px solid var(--saffron); }
  .logo-text { font-family: 'Yatra One', cursive; font-size: 26px; color: var(--saffron); letter-spacing: 1px; line-height: 1; }
  .logo-sub { font-size: 11px; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }
  .hdiv { width: 1px; height: 36px; background: #3a2e1e; }
  .hinfo { font-size: 11px; color: #8a7a60; letter-spacing: 1px; text-transform: uppercase; }
  .hname { font-size: 14px; color: #c9b080; font-weight: 500; }
  .main { display: flex; flex: 1; overflow: hidden; }
  .sidebar { width: 280px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .sb-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--border); }
  .sb-title { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .sb-bc { font-size: 13px; color: var(--saffron); font-weight: 500; }
  .vlist { flex: 1; overflow-y: auto; padding: 8px 0; }
  .vitem { padding: 10px 16px; cursor: pointer; border-left: 3px solid transparent; transition: all 0.15s; display: flex; align-items: center; gap: 10px; }
  .vitem:hover { background: #F5EDD8; border-left-color: var(--gold); }
  .vitem.active { background: #FEF0DC; border-left-color: var(--saffron); }
  .vnum { width: 22px; height: 22px; border-radius: 50%; background: var(--border); color: var(--muted); font-size: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; }
  .vitem.active .vnum { background: var(--saffron); color: white; }
  .vname { font-size: 13px; font-weight: 500; color: var(--dark); line-height: 1.2; }
  .vcnt { font-size: 10px; color: var(--muted); margin-top: 1px; }
  .vitem.traced .vname::after { content: ' ●'; color: var(--saffron); font-size: 8px; }
  .upanel { border-top: 1px solid var(--border); background: #FFF4E8; flex-shrink: 0; max-height: 240px; overflow-y: auto; }
  .up-head { padding: 10px 16px 6px; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); position: sticky; top: 0; background: #FFF4E8; border-bottom: 1px solid var(--border); }
  .uitem { padding: 7px 16px; font-size: 12px; color: #4a3a22; cursor: pointer; border-left: 2px solid transparent; display: flex; align-items: center; gap: 8px; transition: all 0.12s; }
  .uitem:hover { background: #FDEBD0; border-left-color: var(--gold); color: var(--saffron); }
  .uitem::before { content: '↗'; font-size: 10px; color: var(--muted); flex-shrink: 0; }
  .uitem:hover::before { color: var(--saffron); }
  #map { flex: 1; z-index: 1; height: 100%; }
  .minfo { position: absolute; bottom: 24px; right: 16px; background: white; border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; font-size: 12px; color: var(--muted); z-index: 999; max-width: 220px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); pointer-events: none; }
  .minfo strong { display: block; font-size: 13px; color: var(--dark); margin-bottom: 3px; }
  .notag { display: inline-block; font-size: 9px; background: #F5EDD8; color: var(--gold); border-radius: 3px; padding: 1px 5px; margin-top: 4px; letter-spacing: 0.5px; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .leaflet-popup-content-wrapper { border-radius: 8px; border: 1px solid var(--border); }
  .ptitle { font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; color: var(--dark); margin-bottom: 4px; }
  .psub { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
  .pbtn { display: inline-block; background: var(--saffron); color: white; font-size: 11px; padding: 5px 10px; border-radius: 4px; text-decoration: none; font-family: 'DM Sans', sans-serif; }
</style>
</head>

</div>

// ─── Name → vasati id mapping (trimmed names to handle trailing spaces in mapnew 2) ───
const nameToId = {
  "NCERT":            9,
  "Annapoorna":       2,
  "Hosakerehalli":    6,
  "Poornaprajna":     10,
  "AGS Layout":       1,
  "Dattatreya":       4,
  "Bhuvaneshwari":    3,
  "TG Layout":        7,
  "Ittamadu":         8,
  "Dwaraka Nagar":    5,
  "Raghavendra":      11,
  "Hanumagiri":       null,  // outer boundary — no sidebar entry
  "Hanumagiri Nagara": null
};

const map = L.map('map', { zoomControl: true }).setView([12.921, 77.542], 14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors', maxZoom: 19
}).addTo(map);
setTimeout(() => map.invalidateSize(), 100);

const layerMap = {};
let activeId = null;

geojson.features.forEach(f => {
  const geomType = f.geometry.type;
  const fname = (f.properties.Name || "").trim();
  const role  = f.properties._role;

  // ── Outer boundary: Hanumagiri polygon — dashed border, near-transparent fill ──
  if (fname === "Hanumagiri" || fname === "Hanumagiri Nagara" || role === "outer") {
    L.geoJSON(f, {
      style: { color: "#E8580A", weight: 3, opacity: 0.9, fill: true, fillColor: "#E8580A", fillOpacity: 0.03, dashArray: "8 5" }
    }).addTo(map);
    return;
  }

  // ── Guide lines: thin dashed, no interaction ──
  if (role === "guide" || geomType === "LineString") {
    L.geoJSON(f, {
      style: { color: "#aaa", weight: 1.2, opacity: 0.5, dashArray: "4 3" }
    }).addTo(map);
    return;
  }

  // ── Polygons with a vasati id ──
  if (geomType !== "Polygon") return;

  const vid   = nameToId[fname];
  const vasati = vid ? vasatiData.find(v => v.id === vid) : null;
  const color  = vid ? colors[vid - 1] : "#999";

  const layer = L.geoJSON(f, {
    style: { color, weight: 2, opacity: 0.9, fillColor: color, fillOpacity: 0.18 }
  }).addTo(map);

  if (vasati) {
    layer.on('click',     () => selectVasati(vasati.id));
    layer.on('mouseover', () => layer.setStyle({ fillOpacity: 0.32, weight: 3 }));
    layer.on('mouseout',  () => { if (activeId !== vasati.id) layer.setStyle({ fillOpacity: 0.18, weight: 2 }); });
    layer.bindPopup(
      `<div class="ptitle">${vasati.name}</div>` +
      `<div class="psub">${vasati.upavasati.length} Upavasati regions</div>` +
      `<a class="pbtn" href="https://www.google.com/maps/search/${encodeURIComponent(vasati.name + ' Bangalore')}" target="_blank">Open in Google Maps ↗</a>`
    );
    layerMap[vasati.id] = layer;
  }
});

// ── Build sidebar ──
const vlistEl = document.getElementById('vlist');
vasatiData.forEach(v => {
  const has = !!layerMap[v.id];
  const el = document.createElement('div');
  el.className = 'vitem' + (has ? ' traced' : '');
  el.dataset.id = v.id;
  el.innerHTML =
    `<div class="vnum" style="${has ? `background:${colors[v.id-1]};color:white` : ''}">${v.id}</div>` +
    `<div><div class="vname">${v.name}</div><div class="vcnt">${v.upavasati.length} upavasati</div></div>`;
  el.addEventListener('click', () => selectVasati(v.id));
  vlistEl.appendChild(el);
});

function selectVasati(id) {
  activeId = id;
  const v     = vasatiData.find(x => x.id === id);
  const color = colors[id - 1];

  document.querySelectorAll('.vitem').forEach(e => e.classList.remove('active'));
  const activeEl = document.querySelector(`.vitem[data-id="${id}"]`);
  activeEl.classList.add('active');
  activeEl.querySelector('.vnum').style.background = color;
  activeEl.querySelector('.vnum').style.color = 'white';

  document.getElementById('upanel').style.display = 'block';
  document.getElementById('uptitle').textContent = v.name + ' — Upavasati';
  document.getElementById('ulist').innerHTML = v.upavasati.map(u =>
    `<div class="uitem" onclick="openMaps('${u.replace(/'/g,"\\'")}','${v.name.replace(/'/g,"\\'")}')">${u}</div>`
  ).join('');

  const has = !!layerMap[id];
  document.getElementById('minfo').innerHTML =
    `<strong style="color:${color}">${v.name}</strong>` +
    `${v.upavasati.length} Upavasati regions` +
    (!has ? '<br><span class="notag">Boundary coming soon</span>' : '');

  Object.entries(layerMap).forEach(([vid, l]) => {
    l.setStyle({ fillOpacity: parseInt(vid) === id ? 0.32 : 0.08, weight: parseInt(vid) === id ? 3 : 1.5 });
  });

  if (layerMap[id]) map.fitBounds(layerMap[id].getBounds(), { padding: [60, 60] });
  else map.setView([12.921, 77.542], 14);
}

function openMaps(u, v) {
  window.open('https://www.google.com/maps/search/' + encodeURIComponent(u + ', ' + v + ', Bangalore'), '_blank');
}
